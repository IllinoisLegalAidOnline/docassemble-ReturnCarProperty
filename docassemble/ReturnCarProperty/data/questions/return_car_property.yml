id: welcome
question: |
  Request return of personal property inside a repossessed car
subquestion: |
  Welcome to Illinois Legal Aid Online's **Request return of personal property inside a repossessed car** Easy Form.

  This program makes a letter asking for the return of your personal property left inside of your repossessed car. If needed, it can also make a letter to the creditor asking them to tell you the name of the repossession agency. The creditor is the company you owe money to, usually a finance company or lender.

  To learn more, read ILAO's article about [**car repossession**](https://www.illinoislegalaid.org/node/32006).
field: sees_nav_bar
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  A company must have repossessed your car with your property inside it to use this program. To make your letter you will need:

  * The repossession agency's name and address,
  * The make, model, and year of your car, and
  * The items you left in your car.

  If you don't know the name of the repossession agency, you will need the name and address of the **{creditor}** instead.

  Set aside 5 to 15 minutes to finish this program. You can log in and save your work to continue later. 

  ${ collapse_template(help_example) }  

  Click on **{green words}** to learn what they mean. Some pages have a question mark in a circle ${ fa_icon("question-circle", color_css="#0dcaf0" ) } that helps explain things.

  After you download your letter, you must mail it to the repossession agency.
terms:
  creditor: |
    The **creditor** is the company you owe money to, usually a finance company or lender. They hired the repossession agency to repossess your car.
---
template: help_example
subject: |
  **You can click sections like this to show more information.**
content: |  
  This is an example of help. Click again to hide.
---
id: about your letter
continue button field: about_your_letter
question: |
  About your letter
subquestion: |
  The letter this program makes will tell the repossession agency they are legally required to give you a detailed list of the property in your car when it was repossessed. It will also ask the agency how you can get the property back from them.

  The Illinois Collateral Recovery Act requires the repossession agency to give you notice within five business days of your car being repossessed. The agency is legally required to keep any personal property from the car for at least 45 days after sending you notice. They may charge a fee for the storage of the property.
  
  If you have not heard from the repossession agency, this program can make a letter to ask your **{creditor}** which agency repossessed your car. To learn more, read ILAO's article about [**responding to a car repossession**](https://www.illinoislegalaid.org/node/31996).
  
  You will need to send the letter by certified mail. Learn more about [**certified mail**](https://faq.usps.com/s/article/Certified-Mail-The-Basics).
---
id: know repo company
question: |
  Do you know the name of the company that repossessed your car?
subquestion: |
  This is referred to as the "repossession company" or "repossession agency." This might not be the same company as the towing company or the **{creditor}**.

  ${collapse_template(where_find_repo_info)}
fields:
  - no label: know_repo_company
    datatype: yesnoradio
---
template: where_find_repo_info
subject: |
  **Learn where to find this information**
content: |
  You can learn about the company that repossessed your car from the creditor. 
  
  The creditor is supposed to send you a notice of repossession. The notice should name the repossession agency that repossessed your car. You can also call the creditor to ask who repossessed your car.
---
id: fin company note
continue button field: fin_company_note
question: |
  Learn which company repossessed your car
subquestion: |
  If you don't know what company repossessed your car, you can ask the creditor. You could call the company, e-mail them, or send them a letter.
  
  This program can make a letter to the creditor asking them to tell you the name of the repossession agency. 

  There may be other things besides this letter that can help. Use [**Get Legal Help**](https://www.illinoislegalaid.org/get-legal-help) to find free or low-cost legal services in your area. You may also be able to file a complaint with the [**Illinois Commerce Commission**](https://www.icc.illinois.gov/authority/collateral-recovery).

  Click **Back** if you made a mistake. Click **Next** if you would like to make a letter to send to the creditor.
---
id: repo company name
question: |
  What is the name of the company that repossessed your car?
subquestion: |
  ${collapse_template(where_find_repo_info)}
fields:
  - Company name: repo_company.name.first
    maxlength: 50
---
id: fin company name
question: |
  What is the name of the creditor?
subquestion: |
  The creditor is the company you owe money to, usually a finance company or lender. They hired the repossession agency to repossess your car.
fields:
  - Company name: fin_company.name.first
    maxlength: 50
---
id: repo company address
question: |
  What is ${ repo_company.possessive('address') }?
subquestion: |
  ${collapse_template(where_find_repo_info)}
fields:
  - Street address: repo_company.address.address
    address autocomplete: True
  - Address line 2: repo_company.address.unit
    required: False
  - City: repo_company.address.city
  - State: repo_company.address.state
    code: |
      states_list()   
    default: IL   
  - ZIP code: repo_company.address.zip
---
id: fin company address
question: |
  What is ${ fin_company.possessive('address') }?
fields:
  - Street address: fin_company.address.address
    address autocomplete: True
  - Address line 2: fin_company.address.unit
    required: False
  - City: fin_company.address.city
  - State: fin_company.address.state
    code: |
      states_list()   
    default: IL   
  - ZIP code: fin_company.address.zip
---
id: repo company account number
question: |
  What is your account number with ${repo_company.name.first}?
subquestion: |
  The account number could contain letters, numbers, or symbols.

  ${ collapse_template(repo_help_account_number) }  

  If you have not been given an account number, you can leave this blank.
fields:
  - Account number : repo_company.account_number
    maxlength: 40
    required: False
---
id: fin company account number
question: |
  What is your account number with ${fin_company.name.first}?
subquestion: |
  The account number could contain letters, numbers, or symbols.

  ${ collapse_template(fin_help_account_number) }  

  If you have not been given an account number, you can leave this blank.
fields:
  - Account number : fin_company.account_number
    maxlength: 40
    required: False
---
template: repo_help_account_number
subject: |
  **Finding your account number**
content: |  
  Your account number should be listed on the collection notice or letter you got from ${ repo_company.name.first } or from the creditor. It might be called your file or customer number.
---
template: fin_help_account_number
subject: |
  **Finding your account number**
content: |  
  Your account number may be listed on letters or other documents you have gotten from ${ fin_company.name.first }. It might be called your file or customer number.
---
id: repo date
question: |
  When was your car repossessed?
subquestion: |
  % if know_repo_company:
  This date may be included on the collection notice or letter you got from ${ repo_company.name.first } or from the company you owe money to.

  % endif
  If you do not know the exact date, enter your best guess.
fields:
  - Date : repo_date
    datatype: date
    max: ${ today().format("yyyy-MM-dd") }
---
id: car info
question: |
  Details about the repossessed car
subquestion: |
  The make, model, and year of your car can usually be found on the title to your car or on your insurance card.

  A car's **make** is the name of the company that made the car. For example: Ford, Toyota, or Honda.

  A car's **model** is the name of the specific line of car made by that company. For example: Explorer, Camry, or Civic.

  A car's **year** is the model year of the type of car.
fields:
  - Vehicle make: car_make
    maxlength: 15
    help: |
      Car examples: Ford, Toyota, or Honda  
  - Vehicle model: car_model
    maxlength: 15
    help: |
      Car examples: Explorer, Camry, or Civic
  - Vehicle year: car_year
    datatype: integer
    maxlength: 4
    min: 1900
    max: 2100
---
id: property left
question: |
  % if i == 0:
  What personal item did you leave in the car?
  % else:
  What is the ${ordinal(i)} personal item you left in the car?
  % endif
subquestion: |
  % if i == 0:
  If you left multiple items in the car, just enter one of them. You will be able to add more items on the following screens.
  % else:
  So far you have told us about ${fix_punctuation(comma_and_list(items.complete_elements()))}
  % endif
fields:
  - Personal item: items[i].name.text
    maxlength: 50
---
id: property there is another
question: |
  Did you leave another personal item in the car?
subquestion: |
  So far you have told us about ${fix_punctuation(comma_and_list(items))}
fields:
  - no label: items.there_is_another
    datatype: yesnoradio
---
id: user name
question: |
  What is your name?
subquestion: |
    If you don't have a first name and a last name, you can enter your name in the field labeled **First** and leave the other fields blank.
fields:
  - First: users[0].name.first
  - Middle: users[0].name.middle
    required: False
  - Last: users[0].name.last
    required: False
  - Suffix: users[0].name.suffix
    help: |
      Some names have a suffix after the last name, such as "Senior," "III," or "Jr." If your name does not have a suffix, you can leave this blank.
    code: |
      name_suffix()
    required: False
---
id: your address
question: |
  What is your current mailing address?
fields:
  - Street address: users[0].address.address
    address autocomplete: True
  - Address line 2: users[0].address.unit
    required: False
  - City: users[0].address.city
  - State: users[0].address.state
    code: |
      states_list()
    default: IL      
  - ZIP code: users[0].address.zip
    required: False
---
id: mail letter date
question: |
  When will you mail your letter?
subquestion: |
  This date will be printed on the letter.
fields:
  - Date : letter_date
    datatype: date
    default: ${ today().format("yyyy-MM-dd") }
    min: ${ today().format("yyyy-MM-dd") }
---
id: forms assembling
continue button field: forms_assembling
question: |
  Almost done
subquestion: |
  After you click **Next**, it may take a few moments to finish making your forms.
  
  ###### You do not need to refresh your screen. Hang in there!
  
  [NEWLINE]
---
id: your contact information
question: |
  What is your contact information?
subquestion: |
  % if know_repo_company:
  You do not have to enter your phone number or email address, but having them in your letter can help ${repo_company.name.first} send you your inventory quicker.
  % else:
  You do not have to enter your phone number or email address, but having them in your letter can help ${fin_company.name.first} send you information about the repossession agency quicker.
  % endif

  ${ collapse_template(contact_info_help) }  
fields:  
  - Phone number: users[0].phone_number
    datatype: al_international_phone
    required: False
  - Email address: users[0].email    
    datatype: email
    required: False
---
template: contact_info_help
subject: |
  **What if I don't want to list my email address?**
content: |  
  If you do not want to enter your personal email address, you can create a new email account to get email about your property.
  
  To make a new email account try one of these email services:
  
  * [**Gmail**](https://accounts.google.com/SignUp)
  * [**Outlook**](https://outlook.live.com/owa/?nlp=1&signup=1)
  * [**Yahoo**](https://login.yahoo.com/account/create?.lang=en-US&.intl=us)
---
id: get docs screen
event: get_docs_screen
question: |
  Download
subquestion: |
  Your letter is ready. View and download your forms below. Click **:edit: Make changes** to fix any mistakes.

  After you get your letter, sign it, make a copy, and send it along to the repossession agency that took your car.  

  ${ action_button_html(url_action('review_answers'), label=':edit: Make changes', color='success', size="md") }

  ${ al_user_bundle.download_list_html() }

  [NEWLINE]

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

  **Note:** This program **does not mail** your letter. You will need to do this yourself.

  Thank you for using ILAO Easy Forms!
under: |
  % if not user_logged_in():
  [${fa_icon("sign-in-alt", color="#0079d0", size="sm")} Sign-in](${url_of('login', next=interview_url())}) or [create](${url_of('register', next=interview_url())}) an ILAO Easy Form account to save your progress (optional).
  % endif 

  [NEWLINE]
  ${ action_button_html(interview_url(i="docassemble.ILAO:feedback.yml", easy_form_interview=ilao_easy_form_url, easy_form_title=ilao_easy_form_title, easy_form_page=current_context().question_id, easy_form_variable=current_context().variable, local=False,reset=1), label=':comment: Was this program helpful?', color="#181c36", size="md", new_window=True) }
---
objects:
  - al_user_bundle: ALDocumentBundle.using(elements= [repo_instructions, fin_instructions, repo_letter, fin_letter], filename="request_to_return_property_in_repossessed_par.pdf", title="All forms")
---
objects:
  - repo_letter: ALDocument.using(title="Letter to repossession agency", filename="request_letter.pdf", has_addendum=False)
  - fin_letter: ALDocument.using(title="Letter to creditor", filename="creditor_letter.pdf", has_addendum=False)
  - repo_instructions: ALDocument.using(title="Instructions", filename="instructions.pdf", has_addendum=False)
  - fin_instructions: ALDocument.using(title="Instructions", filename="creditor_instructions.pdf", has_addendum=False)
---
code: |
  repo_instructions.enabled = False
  fin_instructions.enabled = False
  repo_letter.enabled = True
  fin_letter.enabled = False
  if know_repo_company:
    repo_instructions.enabled = True
  if not know_repo_company:
    fin_letter.enabled = True
    fin_instructions.enabled = True
